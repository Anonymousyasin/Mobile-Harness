name: Final Build & Release — Pi Agent 32-bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download Pi Agent binary
        run: |
          mkdir -p app/src/main/assets/pi/
          curl -sL -o /tmp/pi.tar.gz "https://github.com/earendil-works/pi/releases/download/v0.85.1/pi-linux-arm64.tar.gz"
          tar -xzf /tmp/pi.tar.gz -C app/src/main/assets/pi/ --strip-components=1 || echo "Extracted"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleOnlineDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        id: find-apk
        run: |
          echo "=== APK search ==="
          find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mh-pi-apk
          path: app/build/outputs/apk/online/debug/app-debug.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mh-pi-apk
          path: ./artifact/

      - name: Checksum + Release
        run: |
          cd artifact/
          sha256sum app-debug.apk | tee SHA256SUMS.txt
          ls -lh
          echo "=== Creating release ==="

          # Use GitHub CLI to create release
          gh release create v1.0.4-pi \
            --repo Anonymousyasin/Mobile-Harness \
            --title "Mobile Harness v1.0.4-pi — Pi Agent + 32-bit ARM" \
            --body "## Mobile Harness — Pi Agent Edition

**Build:** ARM32 (armeabi-v7a) + ARM64 (arm64-v8a)
**Harness:** Pi Agent v0.85.1 (replaces Claude Code)
**Platform:** Android 9+ (API 28+)

### What's changed
- Claude Code CLI replaced with Pi Agent (armv7l binary)
- Full 32-bit ARM support via dual ABI build
- All existing features preserved" \
            --prerelease \
            app-debug.apk SHA256SUMS.txt

          echo "=== Release created ==="
          gh release view v1.0.4-pi --repo Anonymousyasin/Mobile-Harness --json url,tags 2>/dev/null | grep -E "url|tag"
