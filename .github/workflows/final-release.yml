name: Final Build & Release — Pi Agent 32-bit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-file: ${{ steps.find.outputs.apk }}
      apk-size: ${{ steps.find.outputs.size }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download Pi Agent binary
        run: |
          mkdir -p app/src/main/assets/pi/
          curl -sL -o /tmp/pi.tar.gz "https://github.com/earendil-works/pi/releases/download/v0.85.1/pi-linux-arm64.tar.gz"
          tar -xzf /tmp/pi.tar.gz -C app/src/main/assets/pi/ --strip-components=1 || echo "Extracted"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleOnlineDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Find APK
        id: find
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          echo "APK: $APK"
          SIZE=$(ls -lh "$APK" 2>/dev/null | awk '{print $5}')
          echo "Size: $SIZE"
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-pi-32bit
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-pi-32bit
          path: ./artifact/

      - name: Checksum
        run: |
          cd artifact/
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-pi
          name: "Mobile Harness v1.0.4-pi — Pi Agent + 32-bit ARM"
          draft: false
          prerelease: true
          body: |
            ## Mobile Harness — Pi Agent Edition

            **Build:** ARM32 (armeabi-v7a) + ARM64 (arm64-v8a)
            **Harness:** Pi Agent v0.85.1 (replaces Claude Code)
            **Platform:** Android 9+ (API 28+)

            ### What's changed
            - Claude Code CLI replaced with Pi Agent (armv7l binary)
            - Full 32-bit ARM support via dual ABI build
            - All existing features preserved

            ### Files
            - `*.apk` — Debug APK (armeabi-v7a + arm64-v8a)
            - `SHA256SUMS.txt` — SHA-256 checksums
          files: |
            artifact/*.apk
            artifact/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
