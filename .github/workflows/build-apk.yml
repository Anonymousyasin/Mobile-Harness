name: Build APK for ARM32 + Pi

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download Pi agent binary (ARM64 + ARM32)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/pi/
          # Latest Pi agent - ARM64 Linux binary (resolved at build time)
          PI_TAG=$(gh api repos/earendil-works/pi/releases/latest --jq .tag_name)
          echo "Pi tag: $PI_TAG"
          curl -sL "https://github.com/earendil-works/pi/releases/download/${PI_TAG}/pi-linux-arm64.tar.gz" \
            -o pi-linux-arm64.tar.gz
          echo "Downloaded ARM64 Pi binary ($PI_TAG)"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (ARM32 + Pi agent)
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-arm32-pi
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-pi-32bit-apk
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30
