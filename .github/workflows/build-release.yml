name: Build & Release 32-bit APK with Pi Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.4)'
        required: false
        default: '1.0.4-pi'
      tag:
        description: 'Git tag for release'
        required: false
        default: 'v1.0.4-pi'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-path: ${{ steps.build.outputs.apk-path }}
      apk-name: ${{ steps.build.outputs.apk-name }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
          key: ndk-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: ndk-

      - name: Verify submodules present
        run: |
          echo "=== submodule check ==="
          ls third_party/proot/src/loader/loader.c
          ls third_party/libandroid-shmem/shmem.c

      - name: Download Pi Agent binary (ARM64)
        run: |
          mkdir -p app/src/main/assets/pi/
          curl -sL "https://github.com/earendil-works/pi/releases/download/v0.85.1/pi-linux-arm64.tar.gz" \
            -o /tmp/pi-arm64.tar.gz
          tar -xzf /tmp/pi-arm64.tar.gz -C app/src/main/assets/pi/ --strip-components=1
          ls -la app/src/main/assets/pi/
          echo "Pi ARM64 binary ready"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build ARM64 + ARM32 debug APK
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Determine APK output
        id: build
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          echo "apk-path=$APK" >> $GITHUB_OUTPUT
          echo "apk-name=$(basename $APK)" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-pi-${{ github.ref_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-harness-pi-${{ github.ref_name }}-debug
          path: ./apk/

      - name: Create checksums
        run: |
          cd apk/
          echo "=== APK checksums ==="
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.0.4-pi' }}
          name: Mobile Harness v${{ inputs.version || '1.0.4-pi' }} — Pi Agent + ARM32
          draft: false
          prerelease: true
          body: |
            ## Mobile Harness — Pi Agent Edition (ARM32 + ARM64)

            ### What's new
            - **Replaced Claude Code with Pi Agent** — your local `armv7l` Pi binary
            - **True 32-bit ARM support** (armeabi-v7a) alongside arm64-v8a
            - Ships with Pi v0.85.1 binary bundled

            ### Architecture
            - Dual ABI: `armeabi-v7a` (32-bit) + `arm64-v8a` (64-bit)
            - Pi Agent harness replaces Claude Code CLI
            - Android 9+ (API 28+)
            - Jetpack Compose UI, Ubuntu 20.04 PRoot layer

            ### Provider compatibility
            - Anthropic API | OpenRouter | DeepSeek | Kimi | Custom
            - All keys stored via Android Keystore AES-256 GCM

            ### Files
            | File | Description |
            |------|-------------|
            | `SHA256SUMS.txt` | SHA-256 checksums |
            | `*.apk` | Debug APK (armeabi-v7a + arm64-v8a) |

            ### Known limitations
            - PRoot is user-space mapping, not hardened isolation
            - Terminal uses process bridge (not full PTY)
            - Heavy builds may be throttled by Android battery policy
          files: |
            apk/*.apk
            apk/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
